services:
  coturn:
    image: coturn/coturn:4.6.3
    container_name: nipto-turn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:?Set TURN_REALM in the server environment}
      - --server-name=${TURN_REALM:?Set TURN_REALM in the server environment}
      - --listening-ip=0.0.0.0
      - --external-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP in the server environment}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in the server environment}
      - --min-port=49160
      - --max-port=49200
      - --cert=/certs/fullchain.pem
      - --pkey=/certs/privkey.pem
      - --no-cli
      - --no-loopback-peers
      - --no-multicast-peers
    volumes:
      - ./certs:/certs:ro
