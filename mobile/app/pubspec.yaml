name: nipto
description: Nipto Social — messaging, status and short videos.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

# Keep direct dependencies limited to packages imported by lib/.
dependencies:
  flutter:
    sdk: flutter
  # Supabase Auth, PostgreSQL, Storage and Realtime.
  supabase_flutter: ^2.18.3
  # Cross-platform HTTP for Nipto identity endpoints (Android and web).
  http: ^1.6.0
  # User-selected photos and videos.
  image_picker: ^1.2.4
  # Playback for feed, status and Shorts.
  video_player: ^2.11.1
  # Audio/video calling.
  flutter_webrtc: ^1.6.3
  # Encrypted platform-backed storage for session material.
  flutter_secure_storage: ^10.0.0
  # Non-secret local PKCE metadata.
  shared_preferences: ^2.5.4
  # Firebase Cloud Messaging push registration and delivery.
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  # Foreground notification display for FCM messages received while open.
  # Pin below 23: v23 raises compileSdk to 37, while the app targets SDK 36.
  flutter_local_notifications: ^22.3.3
  # Opening external privacy/policy links from settings.
  url_launcher: ^6.3.3

# Test and lint tooling only; never imported by production app code.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/nipto_logo.png

