name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.nipto --project-name nipto .

      - name: Configure WebRTC media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />',
          ]
          for permission in permissions:
              name = permission.split('android:name="', 1)[1].split('"', 1)[0]
              if name not in manifest:
                  manifest = manifest.replace("<application", permission + "\n    <application", 1)
          path.write_text(manifest)
          PY

      - name: Configure password recovery deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          if "nipto://auth-callback" not in manifest:
              activity_start = manifest.find('android:name=".MainActivity"')
              if activity_start < 0:
                  raise SystemExit("Generated MainActivity declaration was not found")
              activity_end = manifest.find("</activity>", activity_start)
              if activity_end < 0:
                  raise SystemExit("Generated MainActivity closing tag was not found")
              intent_filter = """            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="nipto" android:host="auth-callback" />
                      </intent-filter>
              """
              manifest = manifest[:activity_end] + intent_filter + manifest[activity_end:]
              path.write_text(manifest)
          PY

      - name: Configure Android plugin repositories
        run: |
          python3 -c "from pathlib import Path; p=Path('android/settings.gradle.kts'); s=p.read_text(); s=s.replace('repositories {', 'repositories {\\n        google()\\n        mavenCentral()', 1); p.write_text(s)"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Format Dart sources
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test

      - name: Install Android NDK with retry
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\\n' | "$SDKMANAGER" --licenses >/dev/null
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;28.2.13676358"; then
              test -x "$ANDROID_HOME/ndk/28.2.13676358/ndk-build" && exit 0
            fi
            echo "NDK installation attempt $attempt failed; retrying after cleanup."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sleep $((attempt * 10))
          done
          echo "Unable to install the required Android NDK after three attempts."
          exit 1

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://advmjribduqzyuwktkod.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_zxqki-GLfT6zi-BXT1h6zw_nWq9Nhye

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nipto-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
