name: Android CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android,web --org com.nipto --project-name nipto .
        working-directory: mobile/app

      - name: Test Android manifest configuration
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Configure Nipto OAuth callback deep link
        run: python3 scripts/configure_android_manifest.py

      - name: Configure WebRTC media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("mobile/app/android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permissions = [
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
              '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />',
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />',
          ]
          for permission in permissions:
              name = permission.split('android:name="', 1)[1].split('"', 1)[0]
              if name not in manifest:
                  manifest = manifest.replace("<application", permission + "\n    <application", 1)
          path.write_text(manifest)
          PY

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format Nipto identity TypeScript
        run: deno fmt supabase/functions/nipto-identity scripts/generate_nipto_oidc_keys.ts

      - name: Check Nipto identity Edge Function and key utility
        run: deno check supabase/functions/nipto-identity/index.ts scripts/generate_nipto_oidc_keys.ts

      - name: Test Nipto identity validation
        run: deno test supabase/functions/nipto-identity/validation_test.ts

      - name: Configure Android plugin repositories
        run: |
          python3 -c "from pathlib import Path; p=Path('mobile/app/android/settings.gradle.kts'); s=p.read_text(); s=s.replace('repositories {', 'repositories {\\n        google()\\n        mavenCentral()', 1); p.write_text(s)"

      - name: Configure Android SDK levels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("mobile/app/android/app/build.gradle.kts")
          text = path.read_text()
          text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          path.write_text(text)
          PY

      - name: Resolve dependencies
        working-directory: mobile/app
        run: flutter pub get

      - name: Remove generated sample test
        run: rm -f mobile/app/test/widget_test.dart

      - name: Format Dart sources
        working-directory: mobile/app
        run: dart format lib test

      - name: Static analysis
        working-directory: mobile/app
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        working-directory: mobile/app
        run: flutter test

      - name: Build Chrome development preview
        working-directory: mobile/app
        run: flutter build web --release

      - name: Install Android NDK with retry
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\\n' | "$SDKMANAGER" --licenses >/dev/null
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;28.2.13676358"; then
              test -x "$ANDROID_HOME/ndk/28.2.13676358/ndk-build" && exit 0
            fi
            echo "NDK installation attempt $attempt failed; retrying after cleanup."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sleep $((attempt * 10))
          done
          echo "Unable to install the required Android NDK after three attempts."
          exit 1

      - name: Build debug APK
        working-directory: mobile/app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nipto-android-debug
          path: mobile/app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
