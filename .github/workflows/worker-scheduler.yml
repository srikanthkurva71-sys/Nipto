name: Worker scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# GitHub schedules only run from the repository's default branch. Keep the
# NIPTO_CRON_SECRET Actions secret in sync with the Supabase CRON_SECRET.
concurrency:
  group: nipto-worker-scheduler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch Nipto background workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Invoke push and privacy workers
        env:
          CRON_SECRET: ${{ secrets.NIPTO_CRON_SECRET }}
        run: python scripts/invoke_nipto_workers.py --all
