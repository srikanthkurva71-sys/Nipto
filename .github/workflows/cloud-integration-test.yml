name: Cloud Nipto app integration test

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CREATE-PROBE to confirm a real probe account will be created
        required: true
        default: ''

concurrency:
  group: cloud-integration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Live Nipto auth and data probe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Confirm live probe consent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "CREATE-PROBE" ]; then
            echo "Refusing to run: workflow_dispatch confirm must be CREATE-PROBE."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android,web --org com.nipto --project-name nipto .
        working-directory: mobile/app

      # Flutter's generated template test is not part of Nipto's test suite and
      # uses a placeholder app that does not exist in this project.
      - name: Remove generated placeholder widget test
        run: rm -f mobile/app/test/widget_test.dart

      - name: Configure Nipto Android platform
        run: python3 scripts/configure_android_platform.py

      - name: Resolve dependencies
        run: flutter pub get
        working-directory: mobile/app

      - name: Generate Nipto launcher icons and native splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
        working-directory: mobile/app

      - name: Format Dart sources
        run: dart format integration_test lib test
        working-directory: mobile/app

      - name: Static analysis
        run: flutter analyze --no-fatal-infos
        working-directory: mobile/app

      # Android compilation is covered by android-ci.yml. This opt-in workflow
      # exercises the real app, auth bridge, and data write in a browser host
      # because the hosted Android emulator image is not reliably bootable.
      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Run live Nipto app integration test in Chrome
        working-directory: mobile/app
        run: flutter test integration_test/nipto_live_auth_and_data_test.dart -d chrome

      - name: Probe cleanup reminder
        if: always()
        run: |
          echo "Find NIPTO_E2E_ID in this run's integration-test log and delete that Supabase auth user/status row."
