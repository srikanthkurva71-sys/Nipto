name: nipto
description: Nipto Social — messaging, status and short videos.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  video_player: ^2.11.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/nipto_launcher.png
  adaptive_icon_background: "#101C50"
  adaptive_icon_foreground: assets/branding/nipto_launcher_foreground.png
  min_sdk_android: 23
